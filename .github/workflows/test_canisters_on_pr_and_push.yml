name: Test canisters on PRs and push to main
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      - name: Cache Docker images.
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dfx
        uses: dfinity/setup-dfx@main
        with:
          dfx-version: "0.16.1"

      - name: Confirm successful installation
        run: dfx --version

      - name: Install npm packages
        run: yarn install --frozen-lockfile

      - name: Start DFX Server
        run: dfx start --background

      - name: Create canisters
        run: dfx canister create --all

      - name: Get Asset Canister WASM
        run: yarn wasm:setup

      - name: Build canister
        run: yarn build

      - name: Generate client
        run: dfx generate

      - name: check controller
        run: dfx canister --network ic info provision

      - name: Add admins
        run: |
          dfx canister --network ic call <canister_name_or_id> add_admin '(principal "acred-4djfc-ledly-qhddc-eugbf-geqcc-w5g2i-dry2j-rce77-vorar-5qe")'
          dfx canister --network ic call <canister_name_or_id> add_admin '(principal "sc4yh-26dym-j4zht-slasf-p3hsn-um2fc-owekl-eczmy-eptpi-lycpw-zae")'

      - name: Run test
        run: yarn test

